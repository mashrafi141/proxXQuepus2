name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (must match app versionName, e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TERABOX_BACKEND_BASE_URL: ${{ vars.TERABOX_BACKEND_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build environment
        run: |
          touch .env .env.example
          echo 'GEMINI_API_KEY=""' > .env
          echo 'GEMINI_API_KEY=""' > .env.example
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Read app version and resolve release tag
        id: release
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="${{ inputs.version }}"
          fi
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v${VERSION_NAME}"
          fi
          case "$TAG_NAME" in
            v*) ;;
            *) TAG_NAME="v${TAG_NAME}" ;;
          esac
          if [ "$TAG_NAME" != "v${VERSION_NAME}" ]; then
            echo "Release tag $TAG_NAME does not match app versionName $VERSION_NAME; update Gradle or the tag." >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$VERSION_NAME as $TAG_NAME"

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          APK_PATH=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "release-output/ProxXQuepus-${{ steps.release.outputs.tag_name }}.apk"
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxXQuepus-${{ steps.release.outputs.tag_name }}-apk
          path: release-output/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: ProxXQuepus ${{ steps.release.outputs.tag_name }}
          files: release-output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
